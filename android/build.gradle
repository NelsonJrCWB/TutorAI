plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-main-package"
}

android {
    namespace "com.tutorai.tutorai"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.tutorai.tutorai"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

// Força a versão de linguagem 1.8 em TODAS as tarefas de compilação Kotlin (incluindo plugins externos como audioplayers)
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        languageVersion = "1.8"
        apiVersion = "1.8"
    }
}

flutter {
    source "../.."
}