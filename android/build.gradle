plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-main-package"
}

android {
    namespace "com.tutorai.tutorai"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-language-version", "1.8"]
    }

    defaultConfig {
        applicationId "com.tutorai.tutorai"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}